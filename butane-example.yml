---
variant: fcos
version: 1.6.0
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQDCYTdAv7RiXHbxmRoqE4EDZFk9w1E2Zb…
storage:
  directories:
    # Folder for podman quadlets
    - path: "/etc/containers/systemd"
      user:
        name: "root"
      group:
        name: "root"
  files:
    # For predictable IPv6 addresses, disable privacy address generation mode
    - path: "/etc/NetworkManager/conf.d/90-override-eui64.conf"
      mode: 0600
      contents:
        inline: |
          [connection-90-override-eui64]
          match-device=type:ethernet
          ipv6.addr-gen-mode=0
systemd:
  units:
    # Enable podman socket
    - name: "podman.socket"
      enabled: true
